<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>88eggs</title>
  <meta name="description" content="88eggs" />
  <meta name="theme-color" content="#f6ddd6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>" />
  <style>
    :root {
      --bg: #f6ddd6;
      --bg-glow: #fdeee9;
      --bg-edge: #eecdc6;
      --ink: #5b4139;
      --shadow: rgba(150, 96, 82, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      background-image: radial-gradient(120% 90% at 50% 34%, var(--bg-glow) 0%, var(--bg) 62%, var(--bg-edge) 100%);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 6vmin;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.75rem, 5vmin, 3.25rem);
      animation: fade-up 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .egg {
      position: relative;
      width: clamp(120px, 26vmin, 210px);
      aspect-ratio: 200 / 258;
    }

    .egg svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 18px 28px var(--shadow));
      animation: float 6s ease-in-out infinite;
    }

    /* soft contact shadow on the ground */
    .egg::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9%;
      width: 62%;
      height: 6%;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, var(--shadow), transparent 78%);
      animation: shade 6s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vmin, 3.5rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2.5%); }
    }

    @keyframes shade {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) scaleX(1); }
      50%      { opacity: 0.6;  transform: translateX(-50%) scaleX(0.9); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="egg">
      <svg viewBox="0 0 200 258" role="img" aria-label="An egg">
        <defs>
          <linearGradient id="shell" x1="0.25" y1="0" x2="0.85" y2="1">
            <stop offset="0%" stop-color="#fffdfa" />
            <stop offset="55%" stop-color="#fdf1e2" />
            <stop offset="100%" stop-color="#f2dcc4" />
          </linearGradient>
          <radialGradient id="sheen" cx="0.36" cy="0.26" r="0.42">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path
          d="M100 4c39 0 78 66 78 128 0 66-35 122-78 122S22 198 22 132C22 70 61 4 100 4Z"
          fill="url(#shell)" />
        <ellipse cx="74" cy="78" rx="34" ry="44" fill="url(#sheen)" transform="rotate(-18 74 78)" />
      </svg>
    </div>
    <h1>88eggs</h1>
  </main>
</body>
</html>
