<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>88eggs</title>
  <meta name="description" content="Eighty-eight eggs. A few have hatched. Come see what got out." />
  <meta name="theme-color" content="#f6ddd6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>" />
  <style>
    :root {
      --bg: #f6ddd6;
      --bg-glow: #fdeee9;
      --bg-edge: #eecdc6;
      --ink: #5b4139;
      --shadow: rgba(150, 96, 82, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
    }

    html { height: 100%; }

    body {
      /* rows: content (centred in the free space) + footer in normal flow, so a
         short/landscape phone scrolls instead of the footer sitting on the egg */
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      justify-items: center;
      align-items: center;
      background: var(--bg);
      background-image: radial-gradient(120% 90% at 50% 34%, var(--bg-glow) 0%, var(--bg) 62%, var(--bg-edge) 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      padding: clamp(1.5rem, 6vmin, 4rem) 1.25rem;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.25rem, 5vmin, 3.25rem);
      padding: clamp(1.5rem, 5vmin, 3rem) 0;
      animation: fade-up 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .egg {
      position: relative;
      display: block;
      width: clamp(120px, 26vmin, 210px);
      aspect-ratio: 200 / 258;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 50% / 42%;
    }

    @media (hover: hover) {
      .egg:hover { animation: wobble 0.9s ease-in-out; }
      .egg:hover svg { animation-play-state: paused; }
    }

    .egg:focus-visible { transform: translateY(-2%) scale(1.04); }
    .egg:active { transform: scale(0.94) rotate(-2deg); }

    .egg:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 8px;
    }

    .egg svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 18px 28px var(--shadow));
      /* floats, then gives a little shiver every cycle — something's in there */
      animation: float 7.5s ease-in-out infinite;
    }

    /* soft contact shadow on the ground */
    .egg::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9%;
      width: 62%;
      height: 6%;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, var(--shadow), transparent 78%);
      animation: shade 6s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vmin, 3.5rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .hint {
      display: inline-flex;
      align-items: center;
      min-height: 44px;               /* comfortable tap target */
      margin: -1.5rem 0 -0.75rem;
      padding: 0 0.75rem;
      font-size: 0.9375rem;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-decoration: none;
      opacity: 0.55;
      transition: opacity 0.4s ease;
    }

    .hint:focus-visible { opacity: 1; }

    @media (hover: hover) {
      .hint:hover,
      main:hover .hint { opacity: 1; }
    }

    /* no hover to reveal it on touch, so keep it legible */
    @media (hover: none) {
      .hint { opacity: 0.8; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      28%      { transform: translateY(-2.5%) rotate(0deg); }
      56%      { transform: translateY(0) rotate(0deg); }
      /* the shiver */
      64%      { transform: translateY(-1%) rotate(-3.5deg); }
      70%      { transform: translateY(-1%) rotate(3deg); }
      76%      { transform: translateY(-1%) rotate(-2deg); }
      82%      { transform: translateY(0) rotate(1deg); }
      88%      { transform: translateY(0) rotate(0deg); }
    }

    @keyframes wobble {
      0%   { transform: translateY(0) rotate(0deg); }
      20%  { transform: translateY(-3%) rotate(-5deg); }
      40%  { transform: translateY(-3%) rotate(4deg); }
      60%  { transform: translateY(-3%) rotate(-3deg); }
      80%  { transform: translateY(-2%) rotate(1.5deg); }
      100% { transform: translateY(-2%) rotate(0deg); }
    }

    @keyframes shade {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) scaleX(1); }
      50%      { opacity: 0.6;  transform: translateX(-50%) scaleX(0.9); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0 1rem;
      padding-top: 1rem;
      font-size: 0.9375rem;
      opacity: 0.7;
      animation: fade-up 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    footer a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 0.5rem;
      color: var(--ink);
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="egg" href="/hatches/" aria-label="Crack the egg open — see what has hatched">
      <svg viewBox="0 0 200 258" role="img" aria-label="An egg">
        <defs>
          <linearGradient id="shell" x1="0.25" y1="0" x2="0.85" y2="1">
            <stop offset="0%" stop-color="#fffdfa" />
            <stop offset="55%" stop-color="#fdf1e2" />
            <stop offset="100%" stop-color="#f2dcc4" />
          </linearGradient>
          <radialGradient id="sheen" cx="0.36" cy="0.26" r="0.42">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path
          d="M100 4c39 0 78 66 78 128 0 66-35 122-78 122S22 198 22 132C22 70 61 4 100 4Z"
          fill="url(#shell)" />
        <ellipse cx="74" cy="78" rx="34" ry="44" fill="url(#sheen)" transform="rotate(-18 74 78)" />
      </svg>
    </a>
    <h1>88eggs</h1>
    <a class="hint" href="/hatches/">psst — something’s in there →</a>
  </main>
  <footer>
    <a href="/terms">Terms</a>
    <a href="/privacy">Privacy</a>
  </footer>
  <!-- Statsig web analytics (auto-captures page views, clicks, web vitals, JS errors) -->
  <script src="https://cdn.jsdelivr.net/npm/@statsig/js-client@3/build/statsig-js-client+web-analytics.min.js?apikey=client-8PKsS9mhukEWaXJPLqwUbnVpxpDSXx1dZknQieBJBcw"></script>
  <script>
    // funnel step 1: they opened the egg
    document.querySelectorAll('.egg, .hint').forEach(function (el) {
      el.addEventListener('click', function () {
        try {
          window.Statsig.instance().logEvent('egg_crack', el.className, {
            from: el.classList.contains('egg') ? 'egg' : 'hint'
          });
        } catch (e) { /* analytics must never break navigation */ }
      });
    });
  </script>
</body>
</html>
